name: Build RMX3474 Kernel with SukiSU Ultra & 4GB Optimizations

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-22.1
          fetch-depth: 1

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 libncurses-dev cpio lz4 zlib1g-dev git curl wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download AOSP Clang Toolchain (r536225)
        run: |
          mkdir -p clang
          echo "Downloading Google AOSP Clang r536225..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz
          tar -xzf clang-r536225.tar.gz -C clang
          rm clang-r536225.tar.gz

      - name: Integrate SukiSU Ultra (Stable v4.3.0)
        run: |
          echo "Integrating SukiSU Ultra v4.3.0..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/v4.3.0/kernel/setup.sh" | bash -s v4.3.0

      - name: Fix Driver Compatibility (Wi-Fi, Camera, 120Hz)
        run: |
          # 1. Match exact crDroid kernel version
          sed -i 's/SUBLEVEL = 289/SUBLEVEL = 293/' Makefile
          touch .scmversion
          sed -i 's/res="${res}-dirty"/# res="${res}-dirty"/' scripts/setlocalversion
          
          # 2. Patch kernel/module.c to allow all vendor drivers to load
          python3 -c '
          with open("kernel/module.c", "r") as f:
              c = f.read()
          import re
          c = re.sub(r"(static inline int same_magic\([^)]+\)\s*\{)([^}]+)(\})", r"\1\n\treturn 1;\n\3", c)
          c = re.sub(r"(static int check_version\([^)]+\)\s*\{)", r"\1\n\treturn 1;", c)
          with open("kernel/module.c", "w") as f:
              f.write(c)
          print("Module compatibility patch applied!")
          '

      - name: Apply Defconfig Tweaks (KPM & 4GB Optimizations)
        run: |
          DEFCONFIG="arch/arm64/configs/vendor/holi-qgki_defconfig"
          
          # Match crDroid localversion
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-qgki-gdd282b447387"/' $DEFCONFIG
          
          # SukiSU Ultra + KPM support
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPM=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          
          # 4GB RAM Smoothness optimizations
          sed -i 's/CONFIG_PAGE_OWNER=y/# CONFIG_PAGE_OWNER is not set/' $DEFCONFIG
          sed -i 's/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set/' $DEFCONFIG
          sed -i 's/CONFIG_DEBUG_INFO_DWARF4=y/# CONFIG_DEBUG_INFO_DWARF4 is not set/' $DEFCONFIG
          sed -i 's/CONFIG_QCOM_KGSL_CONTEXT_DEBUG=y/# CONFIG_QCOM_KGSL_CONTEXT_DEBUG is not set/' $DEFCONFIG
          
          # Fast ZRAM LZ4 compression
          echo "CONFIG_ZRAM_DEF_COMP_LZ4=y" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_LZ4=y" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_LZ4_HC=y" >> $DEFCONFIG

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          MAKE_ARGS="O=out ARCH=arm64 SUBARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 KCFLAGS=-Wno-error"
          
          make $MAKE_ARGS vendor/holi-qgki_defconfig
          make -j$(nproc --all) $MAKE_ARGS Image
          
          echo "Kernel compiled successfully!"
          ls -lh out/arch/arm64/boot/Image

      - name: Package AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp out/arch/arm64/boot/Image AK3/
          cd AK3
          
          # Configure AnyKernel3 for RE54CBL1 / oscar
          sed -i 's/device.name1=.*/device.name1=RE54CBL1/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=oscar/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=RMX3474/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=RMX3471/' anykernel.sh
          sed -i 's/device.name5=.*/device.name5=RMX3472/' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=boot;|' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto;/' anykernel.sh
          
          zip -r9 ../SukiSU-Ultra-RMX3474-4GB-AK3.zip * -x .git .gitignore README.md
          cd ..

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-RMX3474-4GB-Artifacts
          path: |
            SukiSU-Ultra-RMX3474-4GB-AK3.zip
            out/arch/arm64/boot/Image

name: Build RMX3474 Kernel with SukiSU Ultra & 4GB Optimizations

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-22.1
          fetch-depth: 1

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 libncurses-dev cpio lz4 zlib1g-dev git curl wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download AOSP Clang Toolchain (r536225)
        run: |
          mkdir -p clang
          echo "Downloading Google AOSP Clang r536225..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz
          tar -xzf clang-r536225.tar.gz -C clang
          rm clang-r536225.tar.gz

      - name: Integrate SukiSU Ultra (Stable v4.3.0)
        run: |
          echo "Integrating SukiSU Ultra v4.3.0..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/v4.3.0/kernel/setup.sh" | bash -s v4.3.0

      - name: Fix Driver Compatibility (Wi-Fi, Camera, 120Hz)
        run: |
          # 1. Match exact crDroid kernel version
          sed -i 's/SUBLEVEL = 289/SUBLEVEL = 293/' Makefile
          touch .scmversion
          sed -i 's/res="${res}-dirty"/# res="${res}-dirty"/' scripts/setlocalversion
          
          # 2. Patch kernel/module.c to allow all vendor drivers to load without version/CRC errors
          python3 -c '
          with open("kernel/module.c", "r") as f:
              c = f.read()
          # Bypass vermagic check (replaces only return expression)
          c = c.replace("return strcmp(amagic, bmagic) == 0;", "return 1;")
          # Bypass CRC symbol check (places return 1 after all variable declarations)
          c = c.replace("struct modversion_info *versions;", "struct modversion_info *versions;\n\treturn 1;")
          with open("kernel/module.c", "w") as f:
              f.write(c)
          print("Module compatibility patch applied successfully!")
          '

      - name: Backport Linux 5.4 Headers for SukiSU Ultra
        run: |
          # 1. Create include/linux/pgtable.h (redirects to asm/pgtable.h for 5.4)
          cat << 'EOF' > include/linux/pgtable.h
          #ifndef _LINUX_PGTABLE_H
          #define _LINUX_PGTABLE_H
          #include <asm/pgtable.h>
          #endif
          EOF
          
          # 2. Add complete Linux 5.8 nofault memory accessor compatibility aliases for 5.4
          cat << 'EOF' >> include/linux/uaccess.h
          #ifndef copy_from_kernel_nofault
          #define copy_from_kernel_nofault probe_kernel_read
          #endif
          #ifndef copy_to_kernel_nofault
          #define copy_to_kernel_nofault probe_kernel_write
          #endif
          #ifndef copy_from_user_nofault
          #define copy_from_user_nofault probe_user_read
          #endif
          #ifndef copy_to_user_nofault
          #define copy_to_user_nofault probe_user_write
          #endif
          #ifndef strncpy_from_user_nofault
          #define strncpy_from_user_nofault strncpy_from_unsafe_user
          #endif
          EOF

          # 3. Ensure kernel_compat.h includes uaccess.h
          sed -i '1s/^/#include <linux\/uaccess.h>\n/' KernelSU/kernel/kernel_compat.h

          # 4. Fix seccomp_cache for Linux 5.4 (seccomp bitmap cache only exists in 5.10+)
          cat << 'EOF' > KernelSU/kernel/infra/seccomp_cache.c
          #include <linux/version.h>
          #include <linux/seccomp.h>
          #include "infra/seccomp_cache.h"

          #ifdef SECCOMP_ARCH_NATIVE_NR
          #include <linux/fs.h>
          #include <linux/nsproxy.h>
          #include <linux/sched/task.h>
          #include <linux/uaccess.h>
          #include <linux/filter.h>
          #include "klog.h"

          struct action_cache {
              DECLARE_BITMAP(allow_native, SECCOMP_ARCH_NATIVE_NR);
          #ifdef SECCOMP_ARCH_COMPAT
              DECLARE_BITMAP(allow_compat, SECCOMP_ARCH_COMPAT_NR);
          #endif
          };

          struct seccomp_filter {
              refcount_t refs;
              refcount_t users;
              bool log;
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)
              bool wait_killable_recv;
          #endif
              struct action_cache cache;
              struct seccomp_filter *prev;
              struct bpf_prog *prog;
              struct notification *notif;
              struct mutex notify_lock;
              wait_queue_head_t wqh;
          };

          void ksu_seccomp_clear_cache(struct seccomp_filter *filter, int nr)
          {
              if (!filter) return;
              if (nr >= 0 && nr < SECCOMP_ARCH_NATIVE_NR)
                  clear_bit(nr, filter->cache.allow_native);
          #ifdef SECCOMP_ARCH_COMPAT
              if (nr >= 0 && nr < SECCOMP_ARCH_COMPAT_NR)
                  clear_bit(nr, filter->cache.allow_compat);
          #endif
          }

          void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr)
          {
              if (!filter) return;
              if (nr >= 0 && nr < SECCOMP_ARCH_NATIVE_NR)
                  set_bit(nr, filter->cache.allow_native);
          #ifdef SECCOMP_ARCH_COMPAT
              if (nr >= 0 && nr < SECCOMP_ARCH_COMPAT_NR)
                  set_bit(nr, filter->cache.allow_compat);
          #endif
          }
          #else
          struct seccomp_filter;
          void ksu_seccomp_clear_cache(struct seccomp_filter *filter, int nr) {}
          void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr) {}
          #endif
          EOF

      - name: Apply Defconfig Tweaks (KPM & 4GB Optimizations)
        run: |
          DEFCONFIG="arch/arm64/configs/vendor/holi-qgki_defconfig"
          
          # SukiSU Ultra & KPM requirements
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPM=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          
          # 4GB RAM & Performance optimizations
          echo "# CONFIG_PAGE_OWNER is not set" >> $DEFCONFIG
          echo "# CONFIG_DEBUG_INFO is not set" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_LZ4=y" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_LZ4_HC=y" >> $DEFCONFIG

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          export KCFLAGS="-Wno-error"
          
          make O=out vendor/holi-qgki_defconfig
          make -j$(nproc --all) O=out

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          
          # Device compatibility fix for RMX3474 (RE54CBL1)
          sed -i 's/device.name1=.*/device.name1=RE54CBL1/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=RMX3474/' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=oscar/' AnyKernel3/anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=boot;/' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto;/' AnyKernel3/anykernel.sh
          
          # Copy compiled kernel Image
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          zip -r9 ../SukiSU-Ultra-RMX3474-4GB-AK3.zip * -x .git .gitignore
          cd ..

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-RMX3474-4GB-AK3
          path: SukiSU-Ultra-RMX3474-4GB-AK3.zip
